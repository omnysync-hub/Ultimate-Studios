<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ultimate Studio Hero</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="preloader" aria-hidden="true">
      <div class="stairs" role="presentation">
        <span class="stair"></span>
        <span class="stair"></span>
        <span class="stair"></span>
        <span class="stair"></span>
        <span class="stair"></span>
        <span class="stair"></span>
      </div>
      <h1 class="preloader-title">ULTIMATE STUDIO</h1>
    </div>

    <main class="hero-page">
      <header class="top-nav">
        <a class="brand" href="#" aria-label="Ultimate Studio Home">
          <span class="brand-mark">S</span>
        </a>
        <nav aria-label="Main navigation">
          <ul>
            <li><a href="#">Stages</a></li>
            <li><a href="#">Facilities</a></li>
            <li><a href="#">Equipment</a></li>
            <li><a href="#">Location</a></li>
            <li><a href="#">Contact</a></li>
          </ul>
        </nav>
      </header>

      <section class="hero" aria-label="Hero">
        <div class="hero-row top-row">
          <h2 class="hero-word white fill-in">SOUTH</h2>
          <h2 class="hero-word outline">SIDE</h2>
          <div class="video-placeholder top-video" aria-label="Video placeholder one"></div>
        </div>

        <hr class="hero-divider" />

        <div class="hero-row bottom-row">
          <div class="video-placeholder bottom-video" aria-label="Video placeholder two"></div>
          <h2 class="hero-word white">STUDIOS</h2>
        </div>
      </section>
    </main>

    <script src="./script.js"></script>
  </body>
</html>
